name: fincopilot
description: AI-powered multi-account personal finance coach.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Routing
  go_router: ^18.1.0

  # Networking
  dio: ^5.4.3+1

  # Local Storage
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.2.3

  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # UI
  flutter_svg: ^2.0.10+1
  shimmer: ^4.0.0
  smooth_page_indicator: ^3.0.0
  pin_code_fields: 8.0.1
  local_auth: ^3.0.2

  # Firebase
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0

  # Utils
  intl: 0.20.3
  url_launcher: ^6.2.6
  app_links: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  freezed: ^4.0.3
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.9
  mockito: ^5.4.4
  riverpod_lint: ^3.1.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  # fonts:
