name: fincopilot
description: AI-powered multi-account personal finance coach.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Routing
  go_router: ^17.2.3

  # Networking
  dio: ^5.11.1

  # Local Storage
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.5.5

  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # UI
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^3.0.0
  pin_code_fields: 8.0.1
  local_auth: ^3.0.1

  # Firebase
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0

  # Utils
  intl: 0.20.2
  url_launcher: ^6.3.2
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^3.0.3
  mockito: ^5.5.0
  riverpod_lint: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  # fonts:
