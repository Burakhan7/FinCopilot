# Yerel geliştirme. Şimdilik sadece SQL Server; Api, Worker, AI Service ve Mock HHS sonraki adımlarda eklenecek.
#   docker compose up -d sqlserver
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fincopilot-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Sadece yerel geliştirme şifresi; api/src/*/appsettings.Development.json ile aynı.
      MSSQL_SA_PASSWORD: "FinCopilot_Dev_2026!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqlserver-data:
